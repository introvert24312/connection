openapi: 3.0.0
info:
  title: Canteen Service API
  description: API for managing canteen operations and food orders
  version: 1.0.0
  contact:
    name: Alice
    email: alice@company.com

servers:
  - url: http://localhost:3001
    description: Development server

paths:
  /healthz:
    get:
      summary: Health check endpoint
      description: Returns the health status of the canteen service
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time

  /v1/order-beef:
    post:
      summary: Order beef from butcher
      description: Creates a new beef order request to be sent to the butcher service
      operationId: orderBeef
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cut
                - kg
                - traceId
              properties:
                cut:
                  type: string
                  description: Type of beef cut requested
                  example: "ribeye"
                kg:
                  type: number
                  minimum: 0.1
                  maximum: 50
                  description: Weight in kilograms
                  example: 2.5
                traceId:
                  type: string
                  format: uuid
                  description: Trace ID for request tracking
                  example: "123e4567-e89b-12d3-a456-426614174000"
                priority:
                  type: string
                  enum: ["low", "normal", "high"]
                  default: "normal"
                  description: Order priority level
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                    format: uuid
                    example: "456e7890-e89b-12d3-a456-426614174001"
                  status:
                    type: string
                    example: "pending"
                  estimatedTime:
                    type: integer
                    description: Estimated preparation time in minutes
                    example: 30
                  traceId:
                    type: string
                    format: uuid
                    example: "123e4567-e89b-12d3-a456-426614174000"
        '400':
          description: Bad request - invalid input parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - insufficient inventory or butcher unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/menu:
    get:
      summary: Get available menu items
      description: Retrieves the current menu with available dishes
      operationId: getMenu
      parameters:
        - name: category
          in: query
          description: Filter by food category
          schema:
            type: string
            enum: ["appetizer", "main", "dessert", "beverage"]
        - name: available
          in: query
          description: Filter by availability
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Menu retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
                  totalCount:
                    type: integer
                    example: 25
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/orders/{orderId}:
    get:
      summary: Get order status
      description: Retrieves the current status of a specific order
      operationId: getOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique identifier for the order
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code identifier
          example: "INVALID_INPUT"
        message:
          type: string
          description: Human-readable error message
          example: "The requested beef cut is not available"
        traceId:
          type: string
          format: uuid
          description: Trace ID for debugging
          example: "123e4567-e89b-12d3-a456-426614174000"
        details:
          type: object
          description: Additional error details
          additionalProperties: true

    MenuItem:
      type: object
      required:
        - id
        - name
        - category
        - price
        - available
      properties:
        id:
          type: string
          format: uuid
          example: "789e0123-e89b-12d3-a456-426614174002"
        name:
          type: string
          example: "Grilled Beef Steak"
        description:
          type: string
          example: "Premium ribeye steak grilled to perfection"
        category:
          type: string
          enum: ["appetizer", "main", "dessert", "beverage"]
          example: "main"
        price:
          type: number
          minimum: 0
          example: 24.99
        available:
          type: boolean
          example: true
        preparationTime:
          type: integer
          description: Estimated preparation time in minutes
          example: 15

    OrderStatus:
      type: object
      required:
        - orderId
        - status
        - createdAt
      properties:
        orderId:
          type: string
          format: uuid
          example: "456e7890-e89b-12d3-a456-426614174001"
        status:
          type: string
          enum: ["pending", "preparing", "ready", "delivered", "cancelled"]
          example: "preparing"
        createdAt:
          type: string
          format: date-time
          example: "2023-12-01T10:30:00Z"
        estimatedTime:
          type: integer
          description: Estimated completion time in minutes
          example: 15
        traceId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"