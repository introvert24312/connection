<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            margin: 20px;
            background: transparent;
            color: #333;
        }
        
        @media (prefers-color-scheme: dark) {
            body { 
                color: #d4d4d4; 
            }
        }
        
        /* Mermaid容器样式 */
        .mermaid {
            text-align: center;
            margin: 20px 0;
            max-width: 100%;
            overflow: auto;
        }
        
        .mermaid.rendered {
            background: transparent;
        }
        
        .mermaid > svg {
            max-width: 100%;
            height: auto;
        }
        
        /* 代码块样式 */
        pre {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
        }
        
        @media (prefers-color-scheme: dark) {
            pre { 
                background: #2d2d2d; 
            }
        }
        
        code {
            background: #f0f0f0;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: ui-monospace, monospace;
        }
        
        @media (prefers-color-scheme: dark) {
            code { 
                background: #3d3d3d; 
            }
        }
    </style>
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Mermaid for diagram rendering -->
    <script src="../mermaid/mermaid.min.js"></script>
</head>
<body>
    <div id="content"></div>
    
    <script>
        // 初始化Mermaid
        const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (window.mermaid && window.mermaid.initialize) {
            window.mermaid.initialize({ 
                startOnLoad: false, 
                securityLevel: 'loose', 
                theme: isDark ? 'dark' : 'base' 
            });
        }
        
        // 渲染Markdown内容
        function renderMarkdown(markdown) {
            const contentDiv = document.getElementById('content');
            
            // 转换Markdown为HTML
            let html = marked.parse(markdown);
            
            // 解析HTML并处理Mermaid代码块
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            // 查找Mermaid代码块并转换
            const mermaidBlocks = Array.from(doc.querySelectorAll('pre code.language-mermaid'));
            mermaidBlocks.forEach(block => {
                const mermaidCode = block.textContent;
                const mermaidDiv = document.createElement('div');
                mermaidDiv.className = 'mermaid';
                mermaidDiv.textContent = mermaidCode;
                
                // 替换原代码块
                block.parentElement.replaceWith(mermaidDiv);
            });
            
            // 更新内容
            contentDiv.innerHTML = doc.body.innerHTML;
            
            // 渲染Mermaid图表
            const mermaidElements = contentDiv.querySelectorAll('.mermaid');
            if (mermaidElements.length > 0 && window.mermaid) {
                window.mermaid.run().then(() => {
                    mermaidElements.forEach(element => {
                        element.classList.add('rendered');
                    });
                }).catch(error => {
                    console.error('Mermaid rendering failed:', error);
                });
            }
        }
        
        // 暴露函数到全局作用域
        window.renderMarkdown = renderMarkdown;
        
        // 监听主题变化
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (window.mermaid && window.mermaid.initialize) {
                    window.mermaid.initialize({ 
                        startOnLoad: false, 
                        securityLevel: 'loose', 
                        theme: e.matches ? 'dark' : 'base' 
                    });
                    
                    // 重新渲染现有的Mermaid图表
                    const mermaidElements = document.querySelectorAll('.mermaid');
                    if (mermaidElements.length > 0) {
                        window.mermaid.run();
                    }
                }
            });
        }
    </script>
</body>
</html>
